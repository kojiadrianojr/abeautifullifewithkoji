name: Deploy to Vercel

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

# Prevent concurrent production deployments; preview deploys can run in parallel.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.DEPLOYMENT_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Cache the weekly image sync so sync-images.ts skips re-downloading
      # unchanged assets from Google Drive on every commit.
      - name: Get cache week key
        id: date
        run: echo "week=$(date +'%Y-%U')" >> "$GITHUB_OUTPUT"

      # Only cache the Google Drive–synced collections. public/images/assets and
      # any root-level images are committed to git and must NOT be cached, or the
      # restore step would clobber freshly-committed assets (e.g. hero-bg-*.webp)
      # with a stale copy from an earlier build this week.
      - name: Cache public images
        uses: actions/cache@v4
        with:
          path: |
            public/images/hero-album
            public/images/gallery
            public/images/throwback
            public/images/prenup
            public/images/dress-code
          key: ${{ runner.os }}-drive-images-${{ steps.date.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-drive-images-

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Pull Vercel project settings (framework detection, env var links, etc.)
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Private config is gitignored — restore it from secrets so it is baked
      # into the build. The guest list is read server-only by /api/guests/search;
      # wedding.json is the site content, consumed at build time via ConfigService.
      - name: Write private config
        env:
          WEDDING_JSON: ${{ secrets.WEDDING_JSON }}
          GUESTS_BEA_JSON: ${{ secrets.GUESTS_BEA_JSON }}
          GUESTS_KOJI_JSON: ${{ secrets.GUESTS_KOJI_JSON }}
        run: |
          mkdir -p config/guests
          printf '%s' "$WEDDING_JSON" > config/wedding.json
          printf '%s' "$GUESTS_BEA_JSON" > config/guests/bea.json
          printf '%s' "$GUESTS_KOJI_JSON" > config/guests/koji.json

      # The prebuild hook (sync-images + optimize-images) runs automatically
      # via the "prebuild" npm script inside `vercel build`.
      - name: Build project
        run: vercel build ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Private config — consumed by next.config.ts to restore gitignored
          # JSON files before webpack compiles. Also set these in the Vercel
          # dashboard so direct (non-CI) Vercel builds work the same way.
          WEDDING_JSON: ${{ secrets.WEDDING_JSON }}
          GUESTS_BEA_JSON: ${{ secrets.GUESTS_BEA_JSON }}
          GUESTS_KOJI_JSON: ${{ secrets.GUESTS_KOJI_JSON }}
          # Build-time secrets (used by prebuild scripts, not stored in Vercel dashboard)
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_HERO_ALBUM_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_HERO_ALBUM_FOLDER_ID }}
          GOOGLE_DRIVE_GALLERY_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_GALLERY_FOLDER_ID }}
          GOOGLE_DRIVE_THROWBACK_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_THROWBACK_FOLDER_ID }}
          GOOGLE_DRIVE_PRENUP_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_PRENUP_FOLDER_ID }}
          GOOGLE_DRIVE_DRESS_CODE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_DRESS_CODE_FOLDER_ID }}
          IMAGE_SOURCE_TYPE: ${{ secrets.IMAGE_SOURCE_TYPE }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_MAINTENANCE_MODE: ${{ secrets.NEXT_PUBLIC_MAINTENANCE_MODE }}
          NEXT_PUBLIC_MAINTENANCE_TOKEN: ${{ secrets.NEXT_PUBLIC_MAINTENANCE_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "DEPLOYMENT_URL=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Prime Vercel's edge cache and warm the serverless function so the site is
      # fast the moment it goes live. Best-effort: warm failures never fail the deploy.
      - name: Warm cache
        env:
          PROD_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          DEPLOY_URL: ${{ steps.deploy.outputs.DEPLOYMENT_URL }}
        run: |
          IS_PROD=${{ github.ref == 'refs/heads/main' }}
          TARGET="$DEPLOY_URL"
          if [ "$IS_PROD" = "true" ] && [ -n "$PROD_URL" ]; then
            TARGET="$PROD_URL"
          fi
          echo "Warming $TARGET"
          # Retry root until 200 (edge HTML) — deploy alias may lag a few s
          for i in $(seq 1 5); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A 'ci-cache-warm' "$TARGET/")
            echo "  GET / -> $code (attempt $i)"
            [ "$code" = "200" ] && break
            sleep 5
          done
          # Warm search lambda (no-store: kills cold start, not cached)
          curl -s -o /dev/null -w '  POST /api/guests/search -> %{http_code}\n' \
            -X POST -H 'Content-Type: application/json' \
            --data '{"query":"__warm__"}' "$TARGET/api/guests/search" || true

